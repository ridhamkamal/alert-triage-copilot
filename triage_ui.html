<title>Alert Triage Copilot</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: two-pane console — ranked queue left, retrieved context right; stacks under 860px. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --line: #d8dee6;
  --line-soft: #e6eaf0;
  --fg: #16202b;
  --fg-dim: #5a6775;
  --fg-faint: #8b97a5;
  --accent: #0d6e8c;
  --accent-soft: #e2f0f5;
  --critical: #b3261e;
  --critical-soft: #fbe9e7;
  --warning: #8a5a00;
  --warning-soft: #fdf2d9;
  --good: #1f6b3f;
  --good-soft: #e4f2e9;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319;
    --surface: #161d25;
    --surface-2: #1d262f;
    --line: #2b3742;
    --line-soft: #222d37;
    --fg: #e4eaf0;
    --fg-dim: #9aa8b6;
    --fg-faint: #6b7988;
    --accent: #4bb8d8;
    --accent-soft: #15323d;
    --critical: #ff8a7d;
    --critical-soft: #3a1c18;
    --warning: #e8b457;
    --warning-soft: #342714;
    --good: #6fcf97;
    --good-soft: #15301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319;
  --surface: #161d25;
  --surface-2: #1d262f;
  --line: #2b3742;
  --line-soft: #222d37;
  --fg: #e4eaf0;
  --fg-dim: #9aa8b6;
  --fg-faint: #6b7988;
  --accent: #4bb8d8;
  --accent-soft: #15323d;
  --critical: #ff8a7d;
  --critical-soft: #3a1c18;
  --warning: #e8b457;
  --warning-soft: #342714;
  --good: #6fcf97;
  --good-soft: #15301f;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* ---- header ---------------------------------------------------------- */
.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 14px 20px 0;
}
.brandrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.span { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }
.synthetic {
  margin-left: auto; font-size: 11px; color: var(--warning);
  background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent);
  padding: 3px 8px; border-radius: 99px; white-space: nowrap;
}
.stats { display: flex; gap: 26px; flex-wrap: wrap; padding: 12px 0 14px; }
.stat .k { font-family: var(--mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-faint); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 12px; }
.filters button {
  font: inherit; font-size: 12px; cursor: pointer;
  background: transparent; color: var(--fg-dim);
  border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px;
}
.filters button:hover { color: var(--fg); border-color: var(--fg-faint); }
.filters button[aria-pressed="true"] {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500;
}

/* ---- panes ----------------------------------------------------------- */
.panes { display: flex; flex: 1; min-height: 0; }
.queue {
  width: 42%; max-width: 520px; min-width: 300px;
  border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface);
}
.detail { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 40px; }

/* ---- queue rows ------------------------------------------------------ */
.row {
  display: grid; grid-template-columns: 3px 26px 1fr; gap: 0 10px;
  padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line-soft);
  cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
  width: 100%; text-align: left; font: inherit; color: inherit;
}
.row:hover { background: var(--surface-2); }
.row[aria-selected="true"] { background: var(--accent-soft); }
.stripe { grid-row: 1 / span 3; border-radius: 0 2px 2px 0; }
.sev-FATAL   .stripe, .sev-SEVERE .stripe { background: var(--critical); }
.sev-ERROR   .stripe { background: var(--warning); }
.sev-WARNING .stripe { background: var(--warning); opacity: .55; }
.sev-INFO    .stripe { background: var(--line); }
.rank {
  grid-row: 1 / span 3; font-family: var(--mono); font-size: 11px;
  color: var(--fg-faint); font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right;
}
.row .line1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.cat { font-family: var(--mono); font-size: 11.5px; font-weight: 500; }
.lvl {
  font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; font-weight: 600;
}
.lvl-FATAL, .lvl-SEVERE { background: var(--critical-soft); color: var(--critical); }
.lvl-ERROR { background: var(--warning-soft); color: var(--warning); }
.lvl-WARNING { background: var(--warning-soft); color: var(--warning); }
.lvl-INFO { background: var(--surface-2); color: var(--fg-dim); }
.nohist {
  font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600;
  padding: 1px 5px; border-radius: 3px; background: var(--critical-soft); color: var(--critical);
}
.row .msg {
  font-size: 12.5px; color: var(--fg-dim); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .why { font-size: 11px; color: var(--fg-faint); margin-top: 3px; }
.row .why b { font-weight: 500; color: var(--fg-dim); }

/* ---- detail ---------------------------------------------------------- */
.dhead { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 18px; }
.dtitle { font-size: 17px; font-weight: 600; margin: 0 0 8px; text-wrap: balance; }
.meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; }
.meta div span { color: var(--fg-faint); }
.meta div b { font-family: var(--mono); font-weight: 500; }
.raw {
  font-family: var(--mono); font-size: 12px; background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 10px 12px; margin: 14px 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}
.sig { font-size: 11px; color: var(--fg-faint); font-family: var(--mono); word-break: break-word; }

h2.sec {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--fg-faint); margin: 26px 0 10px; font-weight: 600;
}
.sugg {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 13px 15px; margin-bottom: 10px;
}
.sugg-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.action { font-weight: 600; font-size: 14px; }
.conf {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
  padding: 2px 6px; border-radius: 3px; margin-left: auto;
}
.conf-high { background: var(--good-soft); color: var(--good); }
.conf-medium { background: var(--warning-soft); color: var(--warning); }
.conf-low { background: var(--surface-2); color: var(--fg-dim); }
.sugg .reason { font-size: 12.5px; color: var(--fg-dim); margin: 6px 0 0; }
.ev { margin-top: 9px; border-top: 1px solid var(--line-soft); padding-top: 8px; }
.ev-l { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); margin-bottom: 4px; }
.ev ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.ev li { font-family: var(--mono); font-size: 11.5px; color: var(--fg-dim); display: flex; gap: 8px; flex-wrap: wrap; }
.ev .ok { color: var(--good); }
.fb { display: flex; gap: 6px; margin-top: 11px; }
.fb button {
  font: inherit; font-size: 11.5px; cursor: pointer; padding: 3px 10px;
  border: 1px solid var(--line); background: transparent; color: var(--fg-dim); border-radius: var(--r);
}
.fb button:hover { border-color: var(--fg-faint); color: var(--fg); }
.fb button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.abstain {
  border: 1px dashed var(--critical); background: var(--critical-soft);
  border-radius: var(--r); padding: 15px 16px;
}
.abstain .t { font-weight: 600; color: var(--critical); margin-bottom: 6px; }
.abstain p { margin: 0 0 8px; font-size: 13px; color: var(--fg-dim); }
.abstain p:last-child { margin-bottom: 0; }

.foot {
  margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line-soft);
  font-size: 11.5px; color: var(--fg-faint); max-width: 62ch;
}
.empty { color: var(--fg-faint); padding: 40px 0; text-align: center; }
.kbd {
  font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line);
  border-radius: 3px; padding: 0 4px; color: var(--fg-dim);
}

@media (max-width: 860px) {
  .panes { flex-direction: column; }
  .queue { width: 100%; max-width: none; min-width: 0; max-height: 44vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { padding: 16px; }
  .top { padding: 12px 16px 0; }
  .stats { gap: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brandrow">
      <h1>Alert Triage Copilot</h1>
      <span class="span" id="span"></span>
      <span class="synthetic">Remediation history is synthetic</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">All alerts</button>
      <button data-f="novel" aria-pressed="false">No precedent</button>
      <button data-f="fatal" aria-pressed="false">Fatal only</button>
      <button data-f="covered" aria-pressed="false">Has suggestions</button>
    </div>
  </header>

  <div class="panes">
    <div class="queue" id="queue" role="listbox" aria-label="Ranked alert queue" tabindex="0"></div>
    <div class="detail" id="detail"></div>
  </div>
</div>

const feedback = {};
let filter = "all", selected = null, view = [];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderStats() {
  const s = DATA.stats;
  document.getElementById("span").textContent = s.span;
  document.getElementById("stats").innerHTML = [
    [s.lines_ingested.toLocaleString(), "lines ingested"],
    [s.alerts_extracted, "alerts"],
    [s.noise_suppressed.toLocaleString(), "noise suppressed"],
    [s.distinct_signatures, "signatures"],
    [Math.round(s.coverage * 100) + "%", "have precedent"],
  ].map(([k, l]) => `<div class="stat"><div class="k">${k}</div><div class="l">${l}</div></div>`).join("");
}

function applyFilter() {
  const q = DATA.queue;
  view = filter === "novel" ? q.filter(a => a.abstained)
       : filter === "fatal" ? q.filter(a => a.level === "FATAL" || a.level === "SEVERE")
       : filter === "covered" ? q.filter(a => !a.abstained)
       : q;
  if (!view.some(a => a.id === selected)) selected = view.length ? view[0].id : null;
}

function renderQueue() {
  const el = document.getElementById("queue");
  if (!view.length) { el.innerHTML = `<div class="empty">Nothing matches this filter.</div>`; return; }
  el.innerHTML = view.map((a, i) => `
    <button class="row sev-${esc(a.level)}" role="option" data-id="${a.id}" aria-selected="${a.id === selected}">
      <div class="stripe"></div>
      <div class="rank">${i + 1}</div>
      <div>
        <div class="line1">
          <span class="cat">${esc(a.category)}</span>
          <span class="lvl lvl-${esc(a.level)}">${esc(a.level)}</span>
          ${a.abstained ? `<span class="nohist">no precedent</span>` : ""}
        </div>
        <div class="msg">${esc(a.content)}</div>
        <div class="why"><b>Ranked here:</b> ${esc(a.rank_reason)}</div>
      </div>
    </button>`).join("");
  const sel = el.querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const a = DATA.queue.find(x => x.id === selected);
  if (!a) { el.innerHTML = `<div class="empty">Select an alert.</div>`; return; }

  const body = a.abstained ? `
    <div class="abstain">
      <div class="t">Nothing in the case base matches this</div>
      <p>${esc(a.fallback.note)} This signature has not been seen before, so there is no prior remediation to offer.</p>
      <p>${esc(a.fallback.suggestion)}</p>
      <p>Component <b style="font-family:var(--mono)">${esc(a.fallback.component)}</b> — start there.</p>
    </div>
    <div class="foot">An empty answer is the correct answer here. A plausible guess with no evidence
    behind it is how an engineer learns to stop trusting the panel, and the first wrong suggestion
    costs more than the hundred right ones earned.</div>`
    : a.suggestions.map((s, i) => `
      <div class="sugg">
        <div class="sugg-head">
          <span class="action">${esc(s.action)}</span>
          <span class="conf conf-${esc(s.confidence)}">${esc(s.confidence)} confidence</span>
        </div>
        <p class="reason">${esc(s.reason)}</p>
        ${s.evidence.length ? `<div class="ev"><div class="ev-l">Drawn from</div><ul>${
          s.evidence.map(e => `<li><span>${esc(e.when)}</span><span>${esc(e.node)}</span>${
            e.helped ? `<span class="ok">resolved</span>` : ""}</li>`).join("")
        }</ul></div>` : ""}
        <div class="fb" data-sugg="${i}">
          ${["Used this", "Didn't use", "Wrong"].map(t =>
            `<button data-v="${esc(t)}" aria-pressed="${feedback[a.id + ":" + i] === t}">${esc(t)}</button>`).join("")}
        </div>
      </div>`).join("");

  el.innerHTML = `
    <div class="dhead">
      <h2 class="dtitle">${esc(a.category)} on ${esc(a.node)}</h2>
      <div class="meta">
        <div><span>Raised</span> <b>${esc(a.ts)}</b></div>
        <div><span>Severity</span> <b>${esc(a.level)}</b></div>
        <div><span>Component</span> <b>${esc(a.component)}</b></div>
        <div><span>Prior cases</span> <b>${a.priors}</b></div>
      </div>
      <div class="raw">${esc(a.content)}</div>
      <div class="sig">signature &nbsp;${esc(a.signature)}</div>
    </div>
    <h2 class="sec">${a.abstained ? "Retrieval" : "Suggested actions"}</h2>
    ${body}
    ${!a.abstained ? `<div class="foot">Suggestions are retrieved from prior incidents with the same
      signature, ranked by how often each action resolved it. The system never executes anything —
      it suggests, and the engineer decides. Remediation records in this build are synthetic, so the
      actions are illustrative; the retrieval, confidence and coverage logic is real.</div>` : ""}`;
}

function render() { applyFilter(); renderQueue(); renderDetail(); }

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

document.getElementById("queue").addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r) return;
  selected = Number(r.dataset.id); render();
});

document.getElementById("detail").addEventListener("click", e => {
  const b = e.target.closest(".fb button"); if (!b) return;
  const key = selected + ":" + b.parentElement.dataset.sugg;
  feedback[key] = feedback[key] === b.dataset.v ? null : b.dataset.v;
  renderDetail();
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const i = view.findIndex(a => a.id === selected);
  if (e.key === "j" || e.key === "ArrowDown") { if (i < view.length - 1) { selected = view[i + 1].id; render(); e.preventDefault(); } }
  if (e.key === "k" || e.key === "ArrowUp") { if (i > 0) { selected = view[i - 1].id; render(); e.preventDefault(); } }
});

renderStats();
render();
</script>
